<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>UAV Kit</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121b2e; --panel2:#18233a; --line:#26324d;
    --text:#e6ecf7; --muted:#8a97b3; --accent:#ffb020; --accent2:#3ec7ff;
    --ok:#35d07f; --warn:#ff6b5b; --violet:#b48cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.96);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px}
  header button{background:none;border:1px solid var(--line);color:var(--text);
    border-radius:10px;width:38px;height:38px;font-size:18px;display:none;flex:none}
  header.sub button{display:block}
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  main{padding:16px;max-width:720px;margin:0 auto 40px}
  .search{width:100%;text-align:left;padding:12px 14px;border-radius:14px;margin-bottom:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px;min-height:112px;display:flex;flex-direction:column;gap:4px;
    color:var(--text);text-align:left;font:inherit;cursor:pointer}
  .tile:active{transform:scale(.98)}
  .tile .ic{font-size:24px;margin-bottom:2px}
  .tile b{font-size:14.5px}
  .tile span{color:var(--muted);font-size:12.5px}
  .tile:last-child:nth-child(odd){grid-column:1 / -1;min-height:auto}
  .sect{color:var(--accent);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin:22px 2px 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .field{display:grid;grid-template-columns:1fr 112px 52px;align-items:center;gap:8px;
    padding:7px 0;border-bottom:1px dashed var(--line)}
  .field:last-child{border-bottom:0}
  .field label{font-size:14px}
  .field label i{display:block;color:var(--muted);font-size:11.5px;font-style:normal}
  .field.wide{grid-template-columns:1fr 1fr}
  input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;font:inherit;text-align:right}
  select{text-align:left}
  input:focus,select:focus{outline:2px solid var(--accent2);border-color:transparent}
  .unit{color:var(--muted);font-size:12.5px}
  table.res{width:100%;border-collapse:collapse}
  table.res td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  table.res tr:last-child td{border-bottom:0}
  table.res td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums;
    font-weight:600;color:var(--accent2);white-space:nowrap}
  table.res td:nth-child(3){color:var(--muted);width:60px;font-size:12.5px}
  table.res td small{display:block;color:var(--muted);font-size:11.5px}
  table.res tr.sh td{color:var(--accent);font-size:11.5px;letter-spacing:1px;text-transform:uppercase;padding-top:14px}
  .hl td:nth-child(2){color:var(--accent)}
  .msg{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
  .msg.warn{background:rgba(255,107,91,.12);border:1px solid rgba(255,107,91,.4)}
  .msg.ok{background:rgba(53,208,127,.1);border:1px solid rgba(53,208,127,.35)}
  .msg.info{background:rgba(62,199,255,.08);border:1px solid rgba(62,199,255,.3);color:#cfe9f7}
  canvas{width:100%;display:block}
  .head{color:var(--muted);font-size:11.5px;margin-bottom:6px}
  .cgrow{display:grid;grid-template-columns:1fr 78px 78px 34px;gap:6px;margin-bottom:6px}
  .cgrow input{text-align:left}
  .cgrow input[type=number]{text-align:right}
  .cgrow button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit}
  .btn{padding:10px 14px;width:100%;margin-top:6px}
  .f{padding:10px 0;border-bottom:1px solid var(--line)}
  .f:last-child{border-bottom:0}
  .f b{display:block;font-size:13.5px;margin-bottom:3px}
  .f code{font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--accent2)}
  .f span{display:block;color:var(--muted);font-size:12px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  @media (max-width:380px){.field{grid-template-columns:1fr 96px 44px}}
</style>
</head>
<body>
<header id="hdr">
  <button id="back" aria-label="Back">&#8592;</button>
  <h1 id="title">UAV Kit<small>Drone design calculator</small></h1>
</header>
<main id="app"></main>

<script src="calc.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = (v, d = 2) => (v === undefined || v === null || !isFinite(v)) ? '–' :
  Math.abs(v) >= 1e6 ? v.toExponential(2) : v.toFixed(d);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('uav:'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('uav:'+k, JSON.stringify(v)); }catch(e){} }
};
const SEC = t => ['__sec', t];
const GROUPS = ['Aerodynamics','Performance','Stability & Structures','Propulsion & Power','Mission Planning','Reference'];

/* common field sets */
const F_AIRFRAME = [
  ['mass','All-up mass','kg',2],
  ['S','Wing area','m²',0.27],
  ['ar','Aspect ratio','–',8],
  ['cd0','Zero-lift drag C_D0','–',0.03,'Clean UAV 0.02 to 0.04'],
  ['e','Oswald efficiency e','–',0.8],
  ['clMax','C_L max','–',1.2],
  ['h','Altitude','m',120],
];

/* =================== TOOLS =================== */
const TOOLS = {
/* ---------- Aerodynamics ---------- */
isa: { icon:'🌡️', name:'Atmosphere (ISA)', sub:'T, p, ρ, a, μ at altitude', group:'Aerodynamics',
  fields:[['h','Altitude','m',120,'Field elevation + flight height']],
  run:v=>{ const r=isa(v.h); return { rows:[
    ['Temperature', fmt(r.T-273.15,2), '°C', fmt(r.T,2)+' K'],
    ['Pressure', fmt(r.p/100,2), 'hPa'],
    ['Density ρ', fmt(r.rho,4), 'kg/m³', 'σ = ρ/ρ₀ = '+fmt(r.sigma,3)],
    ['Speed of sound a', fmt(r.a,1), 'm/s'],
    ['Dynamic viscosity μ', fmt(r.mu*1e5,4), '×10⁻⁵ Pa·s'],
  ], msgs: v.h>20000||v.h<0 ? [['warn','Model valid from 0 to 20 000 m.']] : [] }; } },

airfoil: { icon:'🪶', name:'NACA Airfoil', sub:'Shape, α_L0, C_l, C_m (thin airfoil)', group:'Aerodynamics',
  fields:[
    ['code','NACA 4-digit code','',"2412",'e.g. 0012, 2412, 4415',null,'text'],
    ['alpha','Angle of attack α','deg',4],
    ['ar','Wing aspect ratio','–',8,'For 3D wing lift'],
    ['e','Oswald efficiency e','–',0.8],
  ],
  run:v=>{
    const c = String(v.code).replace(/\D/g,'');
    if (c.length!==4) return { rows:[], msgs:[['warn','Enter a 4-digit NACA code such as 2412.']] };
    const r = naca4({...v, code:c}), msgs=[];
    if (r.t>0.21) msgs.push(['info','Very thick section: thin airfoil theory loses accuracy.']);
    if (Math.abs(v.alpha)>12) msgs.push(['warn','Thin airfoil theory ignores stall. Real sections typically stall around 12 to 16°.']);
    return { msgs,
      chart:{ title:'NACA '+c+' profile', equal:true, h:150,
        series:[{pts:r.shape,color:'--accent2',fill:true},{pts:r.camber,color:'--accent',dash:[5,4],width:1.4}] },
      rows:[
        SEC('Geometry'),
        ['Max camber', fmt(r.m*100,1), '% c', 'at '+fmt(r.p*100,0)+'% chord'],
        ['Max thickness', fmt(r.tMax*100,1), '% c', 'at '+fmt(r.xT*100,0)+'% chord'],
        SEC('Thin airfoil theory (2D)'),
        ['Zero-lift angle α_L0', fmt(r.aL0,2), 'deg', '', true],
        ['Lift coefficient C_l', fmt(r.cl2d,3), '–', 'C_l = 2π(α − α_L0)', true],
        ['Moment coeff. C_m,c/4', fmt(r.cm4,4), '–', 'Constant with α (aerodynamic centre at c/4)'],
        SEC('Finite wing (3D)'),
        ['Lift slope a', fmt(r.a3d,4), '/deg', '2D: '+fmt(2*Math.PI*Math.PI/180,4)+' /deg'],
        ['Wing C_L', fmt(r.CL3d,3), '–', '', true],
      ]};
  } },

wing: { icon:'🛩️', name:'Wing Sizing', sub:'Area, span, chord, loading, Re', group:'Aerodynamics',
  fields:[
    ['mass','All-up mass','kg',2],
    ['vStall','Stall speed','m/s',10,'Landing speed ≈ 1.2 × this'],
    ['clMax','C_L max','–',1.2,'Flat-bottom airfoil ≈ 1.2 to 1.4'],
    ['ar','Aspect ratio','–',8,'Trainer 6, glider 12+'],
    ['vCruise','Cruise speed','m/s',16],
    ['h','Altitude','m',120],
  ],
  run:v=>{ const r=wingSizing(v), msgs=[];
    if (r.Re<1e5) msgs.push(['warn','Re below 100 000: low-Re regime, expect laminar separation. Pick a low-Re airfoil (e.g. SD7037, S1223).']);
    if (r.clCruise>0.8) msgs.push(['warn','Cruise C_L is high. Increase wing area or cruise speed.']);
    if (r.wingLoadingG<30) msgs.push(['info','Very light wing loading: floaty, sensitive to gusts.']);
    if (r.wingLoadingG>100) msgs.push(['info','High wing loading: fast, needs a longer takeoff run.']);
    return { msgs, rows:[
      ['Weight W', fmt(r.W,2), 'N'],
      ['Wing area S', fmt(r.S,4), 'm²', fmt(r.S*1e4,0)+' cm²', true],
      ['Wingspan b', fmt(r.b*1000,0), 'mm', '', true],
      ['Mean chord c', fmt(r.c*1000,0), 'mm', '', true],
      ['Wing loading', fmt(r.wingLoading,1), 'N/m²', fmt(r.wingLoadingG,1)+' g/dm²'],
      ['Cruise C_L', fmt(r.clCruise,3), '–'],
      ['Reynolds no. (cruise)', fmt(r.Re/1000,0), '×10³'],
    ]}; } },

/* ---------- Performance ---------- */
perf: { icon:'📈', name:'Range & Endurance', sub:'L/D, power curve, flight time', group:'Performance',
  fields:[...F_AIRFRAME,
    ['capAh','Battery capacity','Ah',5],
    ['volts','Battery voltage','V',11.1,'3S LiPo = 11.1 V'],
    ['dod','Usable fraction','–',0.8],
    ['eta','Total efficiency','–',0.5,'prop × motor × ESC'],
  ],
  run:v=>{ const r=fixedWingPerf(v), msgs=[], vSafe=1.2*r.vStall;
    if (r.vMp<vSafe) msgs.push(['warn',`Best-endurance speed (${fmt(r.vMp,1)} m/s) is below 1.2 × V_stall (${fmt(vSafe,1)} m/s). Real loiter must be flown faster, so endurance will be lower than shown.`]);
    return { msgs,
      chart:{ title:'Power required vs airspeed', xlab:'m/s', ylab:'W', series:[{pts:r.curve}],
        marks:[[r.vMp,r.pMp,'V_mp'],[r.vMd,r.pMd,'V_md']], shade:[r.curve[0][0],vSafe,'stall zone'] },
      rows:[
        ['Max L/D', fmt(r.LDmax,1), '–', 'k = '+fmt(r.k,4), true],
        ['Stall speed', fmt(r.vStall,1), 'm/s'],
        ['Best endurance speed V_mp', fmt(r.vMp,1), 'm/s', 'Min power: '+fmt(r.pMp,1)+' W'],
        ['Best range speed V_md', fmt(r.vMd,1), 'm/s', 'Min drag, C_L = '+fmt(r.clMd,3)],
        ['Usable energy', fmt(r.energyWh,1), 'Wh'],
        ['Max endurance', fmt(r.endurMp,0), 'min', 'at V_mp', true],
        ['Max range', fmt(r.rangeMd,1), 'km', 'at V_md, no wind', true],
      ]}; } },

climb: { icon:'⛰️', name:'Climb & Glide', sub:'Rate of climb, V_max, glide range', group:'Performance',
  fields:[...F_AIRFRAME,
    ['pMax','Max electrical power','W',250,'Full-throttle V × I'],
    ['eta','Total efficiency','–',0.5],
    ['hGlide','Glide start height','m',100,'Above ground, motor off'],
  ],
  run:v=>{ const r=climbGlide(v), msgs=[];
    if (!(r.rocMax>0)) msgs.push(['warn','Not enough power to climb at any speed. Increase power or reduce weight/drag.']);
    else if (r.rocMax<2) msgs.push(['info','Climb rate under 2 m/s is sluggish for a UAV.']);
    if (r.vMp < 1.2*r.vS) msgs.push(['info','Min-sink speed is limited by the 1.2 × V_stall safety margin.']);
    return { msgs,
      chart:{ title:'Rate of climb vs airspeed', xlab:'m/s', ylab:'m/s', zero:true, series:[{pts:r.curve}],
        marks: r.rocMax>0 ? [[r.vY,r.rocMax,'V_y']] : [] },
      rows:[
        SEC('Powered'),
        ['Power available', fmt(r.pAv,0), 'W', 'η × P_elec'],
        ['Max rate of climb', fmt(r.rocMax,2), 'm/s', fmt(r.rocMax*60,0)+' m/min', true],
        ['Best climb speed V_y', fmt(r.vY,1), 'm/s'],
        ['Max climb angle', fmt(r.gammaMax,1), 'deg', 'at '+fmt(r.vX,1)+' m/s'],
        ['Max level speed', fmt(r.vMax,1), 'm/s', fmt(r.vMax*3.6,0)+' km/h', true],
        SEC('Gliding (motor off)'),
        ['Best glide speed', fmt(r.vBg,1), 'm/s', 'Glide ratio '+fmt(r.ldBg,1)+' : 1'],
        ['Min sink rate', fmt(r.sinkMin,2), 'm/s', 'at '+fmt(r.vMs,1)+' m/s'],
        ['Glide range', fmt(r.glideRange,2), 'km', 'from '+v.hGlide+' m, still air', true],
        ['Max glide time', fmt(r.glideTime,1), 'min', 'at min sink'],
      ]}; } },

turn: { icon:'🔄', name:'Turn Performance', sub:'Load factor, radius, turn rate', group:'Performance',
  fields:[...F_AIRFRAME,
    ['V','Airspeed','m/s',15],
    ['bank','Bank angle','deg',30],
  ],
  run:v=>{ if (v.bank<=0||v.bank>=89) return {rows:[],msgs:[['warn','Bank angle must be between 0 and 89°.']]};
    const r=turnPerf(v), msgs=[];
    if (r.clReq>v.clMax) msgs.push(['warn',`Required C_L (${fmt(r.clReq,2)}) exceeds C_L max: the aircraft stalls in this turn. Fly faster or bank less.`]);
    else if (v.V < 1.2*r.vSturn) msgs.push(['warn','Airspeed is within 20% of the turning stall speed.']);
    else msgs.push(['ok','Turn is within the lift limit.']);
    return { msgs, rows:[
      ['Load factor n', fmt(r.n,2), 'g', 'n = 1 / cos φ', true],
      ['Turn radius', fmt(r.R,1), 'm', '', true],
      ['Turn rate', fmt(r.omega,1), 'deg/s', '360° in '+fmt(r.t360,1)+' s'],
      ['Stall speed in turn', fmt(r.vSturn,1), 'm/s', 'Level: '+fmt(r.vS,1)+' m/s'],
      ['C_L required', fmt(r.clReq,3), '–'],
      ['Power required (turn)', fmt(r.pTurn,1), 'W', 'Level flight: '+fmt(r.pLevel,1)+' W'],
    ]}; } },

vn: { icon:'📐', name:'V-n Diagram', sub:'Flight envelope & manoeuvre speed', group:'Performance',
  fields:[
    ['mass','All-up mass','kg',2], ['S','Wing area','m²',0.27],
    ['clMax','C_L max','–',1.2], ['clMin','C_L min (negative)','–',-0.8],
    ['nPos','Positive limit load','g',3.8,'CS-23 normal: 3.8'], ['nNeg','Negative limit load','g',-1.5],
    ['vC','Cruise speed V_C','m/s',22], ['vdF','Dive factor V_D / V_C','–',1.4,'CS-23: at least 1.4'], ['h','Altitude','m',120],
  ],
  run:v=>{ const r=vnDiagram(v), msgs=[];
    if (r.vA>r.vC) msgs.push(['info','Manoeuvre speed V_A is above V_C: full control deflection is not safe at cruise. Consider a higher V_C or lower wing loading.']);
    return { msgs,
      chart:{ title:'Manoeuvring envelope', xlab:'m/s', ylab:'n', zero:true, h:240,
        series:[{pts:r.env,color:'--accent2',fill:true}],
        marks:[[r.vS,1,'V_S'],[r.vA,v.nPos,'V_A'],[r.vC,v.nPos,'V_C'],[r.vD,v.nPos,'V_D']] },
      rows:[
        ['Stall speed V_S (1 g)', fmt(r.vS,1), 'm/s'],
        ['Manoeuvre speed V_A', fmt(r.vA,1), 'm/s', 'V_S × √n_max', true],
        ['Cruise speed V_C', fmt(r.vC,1), 'm/s'],
        ['Dive speed V_D', fmt(r.vD,1), 'm/s', '', true],
        ['Negative stall (−1 g)', fmt(r.vSn,1), 'm/s'],
        ['Negative corner V_G', fmt(r.vG,1), 'm/s'],
        ['Ultimate load (×1.5)', fmt(v.nPos*1.5,2), 'g', 'Design structure to this'],
      ]}; } },

takeoff: { icon:'🛫', name:'Takeoff & Landing', sub:'Ground roll distances', group:'Performance',
  fields:[...F_AIRFRAME,
    ['clG','Ground-roll C_L','–',0.4,'Wing lift during roll'],
    ['T0','Static thrust','N',12,'From Motor & Prop tool'],
    ['vPitch','Prop pitch speed','m/s',30,'Thrust → 0 at this speed'],
    ['mu','Rolling friction μ','–',0.04,'Tarmac 0.03, grass 0.08 to 0.1'],
    ['muB','Landing friction μ','–',0.1,'No brakes ≈ rolling friction'],
  ],
  run:v=>{ const r=takeoffLanding(v), msgs=[];
    if (!r.ok) msgs.push(['warn',`Cannot reach lift-off speed (${fmt(r.vLO,1)} m/s): stuck at ${fmt(r.vReached,1)} m/s. Need more thrust or a hand/catapult launch.`]);
    if (r.tw>=1) msgs.push(['info','T/W ≥ 1: can also climb vertically or be hand-launched easily.']);
    return { msgs, rows:[
      ['Thrust-to-weight', fmt(r.tw,2), '–'],
      SEC('Takeoff'),
      ['Lift-off speed', fmt(r.vLO,1), 'm/s', '1.1 × V_S'],
      ['Ground roll', r.ok?fmt(r.sTO,1):'–', 'm', '', true],
      ['Time to lift-off', r.ok?fmt(r.tTO,1):'–', 's'],
      SEC('Landing'),
      ['Approach speed', fmt(r.vApp,1), 'm/s', '1.3 × V_S'],
      ['Touchdown speed', fmt(r.vTD,1), 'm/s', '1.15 × V_S'],
      ['Landing roll', fmt(r.sL,1), 'm', '', true],
    ]}; } },

/* ---------- Stability & Structures ---------- */
tail: { icon:'🎯', name:'Tail & Static Margin', sub:'Tail volume, neutral point, SM', group:'Stability & Structures',
  fields:[
    ['S','Wing area','m²',0.27], ['c','Wing MAC','m',0.18], ['b','Wingspan','m',1.46], ['ar','Wing aspect ratio','–',8],
    ['lh','H-tail arm l_h','m',0.6,'Wing AC to tail AC'], ['lv','V-tail arm l_v','m',0.6],
    ['vh','H-tail volume V_H','–',0.4,'UAV typical 0.35 to 0.5'], ['vv','V-tail volume V_V','–',0.03,'Typical 0.02 to 0.04'],
    ['arH','H-tail aspect ratio','–',4], ['arV','V-tail aspect ratio','–',1.5],
    ['xcg','CG position','% MAC',30,'From CG Calculator'], ['eta','Tail efficiency η_t','–',0.9],
  ],
  run:v=>{ const r=tailSM(v), msgs=[];
    if (r.sm<0) msgs.push(['warn','Negative static margin: the aircraft is statically UNSTABLE in pitch. Move the CG forward or enlarge the tail.']);
    else if (r.sm<5) msgs.push(['warn','Static margin under 5%: marginally stable, twitchy in pitch.']);
    else if (r.sm>20) msgs.push(['info','Static margin above 20%: very stable but sluggish, needs a lot of elevator.']);
    else msgs.push(['ok','Static margin in the healthy 5 to 20% band.']);
    return { msgs, rows:[
      SEC('Horizontal tail'),
      ['Area S_h', fmt(r.Sh*1e4,0), 'cm²', '', true],
      ['Span', fmt(r.bh*1000,0), 'mm'], ['Chord', fmt(r.ch*1000,0), 'mm'],
      SEC('Vertical tail'),
      ['Area S_v', fmt(r.Sv*1e4,0), 'cm²', '', true],
      ['Height', fmt(r.hv*1000,0), 'mm'], ['Chord', fmt(r.cv*1000,0), 'mm'],
      SEC('Longitudinal stability'),
      ['Wing lift slope', fmt(r.aw,3), '/rad', 'Helmbold formula'],
      ['Downwash dε/dα', fmt(r.deda,3), '–'],
      ['Neutral point', fmt(r.hnp,1), '% MAC', '', true],
      ['Static margin', fmt(r.sm,1), '% MAC', 'SM = h_np − h_cg', true],
    ]}; } },

spar: { icon:'🦴', name:'Wing Spar Check', sub:'Bending stress, deflection, mass', group:'Stability & Structures',
  fields:[
    ['mass','All-up mass','kg',2], ['n','Design load factor','g',4], ['b','Wingspan','m',1.46],
    ['sf','Safety factor','–',1.5],
    ['od','Tube outer diameter','mm',10], ['wall','Wall thickness','mm',1,'Larger than OD/2 means solid rod'],
    ['mat','Material','',"carbon",'',Object.entries(MATERIALS).map(([k,m])=>[k,m.name])],
  ],
  run:v=>{ const r=spar(v), msgs=[];
    if (r.ms<0) msgs.push(['warn','Negative margin of safety: the spar fails at the design load. Use a bigger or thicker tube.']);
    else msgs.push(['ok',`Spar passes with margin of safety ${fmt(r.ms,2)}.`]);
    if (r.deflPct>5) msgs.push(['info','Tip deflection above 5% of semi-span: wing will flex visibly.']);
    msgs.push(['info','Assumes one tube carries all bending, elliptic lift, fixed at the root.']);
    return { msgs, rows:[
      ['Root bending moment', fmt(r.Mroot,2), 'N·m', 'M = nWb / 3π'],
      ['Max bending stress', fmt(r.sigma/1e6,1), 'MPa', '', true],
      ['Allowable stress', fmt(r.allow/1e6,0), 'MPa'],
      ['Margin of safety', fmt(r.ms,2), '–', 'σ_allow / (SF·σ) − 1', true],
      ['Tip deflection', fmt(r.defl*1000,1), 'mm', fmt(r.deflPct,1)+'% of semi-span'],
      ['Spar mass (full span)', fmt(r.sparMass*1000,0), 'g'],
    ]}; } },

/* ---------- Propulsion & Power ---------- */

/* =================== RENDERING =================== */
function allTiles(){ return [...Object.entries(TOOLS), ...EXTRA]; }

function home(){
  setHeader('UAV Kit','Drone design calculator', false);
  $('#app').innerHTML = `<input class="search" id="q" type="search" placeholder="Search tools (e.g. stall, battery, tail)"><div id="tiles"></div>
    <div class="foot">${allTiles().length} tools · all calculations run offline on your phone.<br>First-order estimates for design and study, verify before flight.</div>`;
  const draw = q => {
    q = q.toLowerCase().trim();
    let html='';
    for (const g of GROUPS){
      const list = allTiles().filter(([id,t])=>t.group===g && (!q || (t.name+' '+t.sub+' '+g).toLowerCase().includes(q)));
      if (!list.length) continue;
      html += `<div class="sect">${g}</div><div class="grid">` + list.map(([id,t])=>
        `<button class="tile" data-go="${id}"><div class="ic">${t.icon}</div><b>${t.name}</b><span>${t.sub}</span></button>`).join('') + '</div>';
    }
    $('#tiles').innerHTML = html || '<div class="empty">No tool matches that search.</div>';
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  };
  $('#q').oninput = e => draw(e.target.value);
  draw('');
}

function setHeader(t, s, sub){
  $('#title').innerHTML = `${t}<small>${s}</small>`;
  $('#hdr').classList.toggle('sub', sub);
}
function go(id){ history.pushState({id},'','#'+id); route(id); }
function route(id){
  window.scrollTo(0,0);
  if (!id) return home();
  if (id==='cg') return cgView();
  if (id==='units') return unitsView();
  if (id==='formulas') return formulaView();
  if (TOOLS[id]) return toolView(id);
  home();
}

function toolView(id){
  const t = TOOLS[id];
  setHeader(t.name, t.sub, true);
  const saved = store.get(id) || {};
  let html = '<div class="card">';
  for (const [k,label,unit,def,hint,opts,type] of t.fields){
    const val = saved[k] ?? def;
    const input = opts
      ? `<select id="f_${k}">${opts.map(([o,l])=>`<option value="${o}" ${o==val?'selected':''}>${l}</option>`).join('')}</select>`
      : type==='text' ? `<input id="f_${k}" type="text" inputmode="numeric" maxlength="4" value="${val}">`
      : `<input id="f_${k}" type="number" inputmode="decimal" step="any" value="${val}">`;
    html += `<div class="field ${opts?'wide':''}"><label>${label}${hint?`<i>${hint}</i>`:''}</label>${input}${opts?'':`<span class="unit">${unit}</span>`}</div>`;
  }
  html += '</div><div id="msgs"></div><div id="chartWrap"></div><div class="card"><table class="res" id="res"></table></div>';
  html += '<button class="btn" id="reset">Reset to defaults</button>';
  $('#app').innerHTML = html;

  const calc = ()=>{
    const v = {};
    for (const [k,, ,def,, opts,type] of t.fields){
      const el = $('#f_'+k);
      if (opts || type==='text') v[k] = el.value;
      else { v[k] = parseFloat(el.value); if (!isFinite(v[k])) v[k] = def; }
    }
    store.set(id, v);
    let out;
    try { out = t.run(v); } catch(e){ out = {rows:[], msgs:[['warn','Check inputs.']]}; }
    $('#msgs').innerHTML = (out.msgs||[]).map(([c,m])=>`<div class="msg ${c}">${m}</div>`).join('');
    $('#res').innerHTML = out.rows.map(r => r[0]==='__sec'
      ? `<tr class="sh"><td colspan="3">${r[1]}</td></tr>`
      : `<tr class="${r[4]?'hl':''}"><td>${r[0]}${r[3]?`<small>${r[3]}</small>`:''}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
    if (out.chart){
      $('#chartWrap').innerHTML = `<div class="card"><div class="head">${out.chart.title||''}</div><canvas id="cv"></canvas></div>`;
      drawChart($('#cv'), out.chart);
    } else $('#chartWrap').innerHTML = '';
  };
  document.querySelectorAll('#app input, #app select').forEach(el=>el.addEventListener('input',calc));
  $('#reset').onclick = ()=>{ store.set(id, null); toolView(id); };
  calc();
}

/* ---------- generic chart ---------- */
function nice(span){ const p=Math.pow(10,Math.floor(Math.log10(span/4))), r=span/4/p; return (r<1.5?1:r<3?2:r<7?5:10)*p; }
function drawChart(cv, c){
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = c.h||220;
  cv.style.height = H+'px'; cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  const L = c.equal?10:44, Rm=12, T=22, B=c.equal?10:30;
  const all = c.series.flatMap(s=>s.pts);
  let x0=Math.min(...all.map(p=>p[0])), x1=Math.max(...all.map(p=>p[0]));
  let y0=Math.min(...all.map(p=>p[1])), y1=Math.max(...all.map(p=>p[1]));
  if (c.zero){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if (!c.equal){ const pad=(y1-y0)*0.08||1; y1+=pad; if (y0<0||c.zero) y0-= (y0<0?pad:0); else y0=0; }
  const pw=W-L-Rm, ph=H-T-B;
  if (c.equal){
    const sx=pw/(x1-x0), sy=ph/((y1-y0)||1), s=Math.min(sx,sy)*0.94;
    const cx=(x0+x1)/2, cy=(y0+y1)/2; x0=cx-pw/2/s; x1=cx+pw/2/s; y0=cy-ph/2/s; y1=cy+ph/2/s;
  }
  const X=v=>L+(v-x0)/(x1-x0)*pw, Y=v=>T+(1-(v-y0)/(y1-y0))*ph;
  g.font='11px system-ui'; g.lineWidth=1;
  if (!c.equal){
    const sy=nice(y1-y0), sx=nice(x1-x0);
    g.strokeStyle=css('--line'); g.fillStyle=css('--muted');
    for (let v=Math.ceil(y0/sy)*sy; v<=y1; v+=sy){ g.beginPath(); g.moveTo(L,Y(v)); g.lineTo(W-Rm,Y(v)); g.stroke(); g.fillText(+v.toFixed(6)+'',4,Y(v)+4); }
    for (let v=Math.ceil(x0/sx)*sx; v<=x1; v+=sx){ g.fillText(+v.toFixed(6)+'',X(v)-6,H-12); }
    if (c.xlab) g.fillText(c.xlab,W-Rm-26,H-1);
    if (c.ylab) g.fillText(c.ylab,4,12);
    if (c.zero && y0<0){ g.strokeStyle=css('--muted'); g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(W-Rm,Y(0)); g.stroke(); }
  }
  if (c.shade && c.shade[1]>x0){
    g.fillStyle='rgba(255,107,91,.12)'; g.fillRect(X(Math.max(c.shade[0],x0)),T,X(c.shade[1])-X(Math.max(c.shade[0],x0)),ph);
    g.fillStyle=css('--warn'); g.fillText(c.shade[2],X(Math.max(c.shade[0],x0))+4,T+12);
  }
  for (const s of c.series){
    const col = css(s.color||'--accent2');
    g.beginPath(); s.pts.forEach(([x,y],i)=> i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y)));
    if (s.fill){ g.fillStyle=col+'22'; g.fill(); }
    g.setLineDash(s.dash||[]); g.strokeStyle=col; g.lineWidth=s.width||2.2; g.stroke(); g.setLineDash([]);
  }
  for (const [x,y,lab] of (c.marks||[])){
    g.fillStyle=css('--accent'); g.beginPath(); g.arc(X(x),Y(y),4.5,0,7); g.fill();
    g.fillText(lab, X(x)-12, Y(y)-9);
  }
}

function cgView(){
  setHeader('CG Calculator','Balance point & % MAC', true);
  const saved = store.get('cg') || { macLE:150, mac:200, items:[
    ['Motor',120,20],['Battery',300,110],['Wing',250,180],['Fuselage + tail',280,260],['Payload',150,140]] };

  $('#app').innerHTML = `
    <div class="msg info">Measure every x from the same datum (e.g. the nose or firewall), positive towards the tail.</div>
    <div class="card">
      <div class="cgrow head"><span>Component</span><span>Mass (g)</span><span>x (mm)</span><span></span></div>
      <div id="rows">${saved.items.map(row).join('')}</div>
      <button class="btn" id="add">+ Add component</button>
    </div>
    <div class="card">
      <div class="field"><label>MAC leading edge<i>x of the MAC leading edge from datum</i></label><input id="macLE" type="number" inputmode="decimal" value="${saved.macLE}"><span class="unit">mm</span></div>
      <div class="field"><label>MAC length<i>Rectangular wing: MAC = chord</i></label><input id="mac" type="number" inputmode="decimal" value="${saved.mac}"><span class="unit">mm</span></div>
    </div>
    <div id="msgs"></div>
    <div class="card"><table class="res" id="res"></table></div>`;
  const calc=()=>{
    const items=[...document.querySelectorAll('#rows .cgrow')].map(r=>{const i=r.querySelectorAll('input');return [i[0].value, parseFloat(i[1].value)||0, parseFloat(i[2].value)||0];});
    const macLE=parseFloat($('#macLE').value)||0, mac=parseFloat($('#mac').value)||0;
    store.set('cg',{items,macLE,mac});
    const r=cg(items.map(([,m,x])=>({mass:m,x})),macLE,mac);
    let m=[];
    if (isFinite(r.pctMac)){
      if (r.pctMac<15) m=['warn','CG is far forward: very stable but nose-heavy, needs more elevator.'];
      else if (r.pctMac<=33) m=['ok','CG within the typical 25 to 33% MAC band for conventional aircraft (15 to 25% for flying wings). Check the static margin in Tail & Static Margin.'];
      else m=['warn','CG is aft of ~33% MAC: risk of pitch instability. Move mass forward.'];
    }
    $('#msgs').innerHTML = m.length?`<div class="msg ${m[0]}">${m[1]}</div>`:'';
    $('#res').innerHTML = `
      <tr><td>Total mass</td><td>${fmt(r.total,0)}</td><td>g</td></tr>
      <tr class="hl"><td>CG position<small>from datum</small></td><td>${fmt(r.x,1)}</td><td>mm</td></tr>
      <tr class="hl"><td>CG location</td><td>${fmt(r.pctMac,1)}</td><td>% MAC</td></tr>`;
  };
  const bind=()=>{
    document.querySelectorAll('#app input').forEach(e=>e.oninput=calc);
    document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{b.parentElement.remove();calc();});
  };
  $('#add').onclick=()=>{ $('#rows').insertAdjacentHTML('beforeend',row(['Item',0,0])); bind(); calc(); };
  bind(); calc();
}

    const q=$('#uq').value, u=UNITS[q], from=$('#uf').value, val=parseFloat($('#uv').value);
    store.set('units',{q,val,from});
    const si = val*u[from];
    $('#res').innerHTML = Object.entries(u).map(([k,f])=>{
      const x=si/f, d=Math.abs(x)>=1000?1:Math.abs(x)>=1?3:5;
      return `<tr class="${k===from?'hl':''}"><td>${k}</td><td>${fmt(x,d)}</td><td></td></tr>`; }).join('');
  };
  fill(s.from);
  $('#uq').oninput = ()=>{ fill(null); calc(); };
  $('#uf').oninput = calc; $('#uv').oninput = calc;
  calc();
}
